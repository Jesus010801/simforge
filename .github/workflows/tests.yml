name: tests

on:
  push:
  pull_request:

jobs:
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run test suite (no gmx, no rdkit)
        run: pytest -m "not gmx and not rdkit" -q -p no:cacheprovider

  gmx-smoke:
    name: gmx-smoke (py3.12)
    runs-on: ubuntu-latest
    # Advisory only: the GROMACS package shipped by Ubuntu apt is several major
    # versions behind what SimForge is validated against (GROMACS 2025.2), so
    # real-gmx behaviour here can differ from a supported install. Failures are
    # informational until a newer GROMACS is available in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GROMACS
        run: sudo apt-get update && sudo apt-get install -y gromacs
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run fast real-gmx subset
        run: pytest -m gmx -q -p no:cacheprovider -k "build or validate or integrate or spec" --maxfail=5
