name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run test suite (no gmx, no rdkit)
        run: pytest -m "not gmx and not rdkit" -q -p no:cacheprovider

  gmx-smoke:
    name: gmx-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
      - name: Install GROMACS + SimForge
        run: |
          conda install -y gromacs
          pip install -e ".[dev]"
      - name: GROMACS version
        run: gmx --version | head -n 20
      - name: Real-gmx multi-component regression
        # The multi-component build path: preparameterized protein + two
        # independently parameterized components with a colliding atomtype name,
        # assembled and passed through `gmx grompp -maxwarn 0`.
        run: pytest -m gmx -q -p no:cacheprovider -k "build or validate or integrate or spec"
